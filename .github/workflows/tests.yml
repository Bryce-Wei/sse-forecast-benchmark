name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-checks:
    name: Offline checks (Python 3.12)
    # Ubuntu keeps the committed line endings byte-for-byte, which the
    # SHA-256 checks in scripts/verify_results.py rely on.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v7

      # requirements/base.txt pins numpy==1.26.4 (no Python 3.13 wheels);
      # the README documents Python 3.12 for the published results.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt

      # TensorFlow, PyTorch and TimesFM are not needed for these checks.
      - name: Install base dependencies
        run: python -m pip install -r requirements/base.txt

      # Recompute archived MAE/RMSE and check reference, figure and PDF hashes.
      # Standard library only; no market data download or training.
      - name: Verify archived results
        run: python scripts/verify_results.py

      # Synthetic fixtures only; no Yahoo data cache or network access.
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest experiments.lstm.test_protocol -v

      - name: Compile check
        run: python -m compileall -q benchmark_support.py forecast_plotting.py experiments scripts tests third_party
