name: Verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/base.txt
      - name: Verify archived results (standard library only)
        run: |
          python scripts/verify_results.py
          python -O scripts/verify_results.py
      - name: Install base dependencies
        run: python -m pip install -r requirements/base.txt
      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
          python -m unittest experiments.lstm.test_protocol -v
      - name: Significance results match archived forecasts
        run: python scripts/significance.py --check
